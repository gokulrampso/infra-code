---
# tasks file for k8s_worker
# Installs Docker, kubeadm, kubelet, and kubectl on worker nodes

- name: Install required packages
  apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - software-properties-common
    state: present
    update_cache: yes

- name: Add Docker GPG key
  apt_key:
    url: https://download.docker.com/linux/ubuntu/gpg
    state: present

- name: Add Docker repository
  apt_repository:
    repo: deb [arch=amd64] https://download.docker.com/linux/ubuntu focal stable
    state: present

- name: Install Docker
  apt:
    name: docker-ce
    state: present
    update_cache: yes

- name: Add Kubernetes apt key
  apt_key:
    url: https://packages.cloud.google.com/apt/doc/apt-key.gpg
    state: present

- name: Add Kubernetes repository
  apt_repository:
    repo: deb http://apt.kubernetes.io/ kubernetes-xenial main
    state: present

- name: Install kubelet, kubeadm, and kubectl at the specified version
  apt:
    name:
      - kubelet={{ kubernetes_version }}
      - kubeadm={{ kubernetes_version }}
      - kubectl={{ kubernetes_version }}
    state: present
    update_cache: yes

- name: Hold kubelet, kubeadm, and kubectl at current version
  apt:
    name:
      - kubelet
      - kubeadm
      - kubectl
    state: present
    update_cache: yes
    allow_unauthenticated: yes
    force: yes
    autoremove: no
    install_recommends: no
    dpkg_options: "--force-confdef --force-confold"
    force_apt_get: yes
    only_upgrade: no
    default_release: ""
    package: "kubelet,kubeadm,kubectl"
    hold: yes

- name: Enable and start Docker
  systemd:
    name: docker
    enabled: yes
    state: started

- name: Enable kubelet
  systemd:
    name: kubelet
    enabled: yes
    state: started
